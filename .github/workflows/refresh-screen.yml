name: Refresh lobby screen

# Why this exists
# ---------------
# docs/ is a static rendering of the WordPress page. Until now it was produced
# by hand, so the public demo showed whatever the feeds happened to say the last
# time somebody ran the snapshot — Ynet and ONE headlines could sit there for
# days. This workflow boots the real theme in Playground on a schedule, renders
# the same page, and publishes it, so the demo is current around the clock with
# nobody's laptop involved.
#
# Why rebuild rather than fetch in the browser: Ynet's RSS sends no CORS header,
# so a static page cannot read it client-side (Hebcal, Open-Meteo and ONE do
# allow it — Ynet is the one that forces a server-side render). Rebuilding also
# keeps the WordPress theme as the single source of truth instead of growing a
# second renderer in JavaScript.
#
# Publishing goes through the Pages artifact rather than committing docs/ back
# to main: a commit every 15 minutes would bury the project's real history.

on:
  schedule:
    # every 15 minutes. GitHub delays scheduled runs under load, so treat this
    # as "about every 15-25 minutes" — still far fresher than a manual snapshot.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress/lobby-screens-theme/**'
      - '.github/workflows/refresh-screen.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running publish finish rather than cancelling it: a half-deployed screen
# is worse than one that is a few minutes behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Boot WordPress Playground
        working-directory: wordpress
        run: |
          npx --yes @wp-playground/cli@latest start \
            --path=./lobby-screens-theme \
            --skip-browser --quiet --port=9400 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9400/ --max-time 3 || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "Playground up after ${i} tries (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "Playground did not come up in time" >&2
          exit 1

      - name: Render the snapshot
        run: ./tools/snapshot.sh http://127.0.0.1:9400

      - name: Fail if the feeds came back empty
        # A snapshot that rendered but lost its content would quietly replace a
        # good screen with an empty one. Cheaper to stop here and keep serving
        # the previous deploy.
        #
        # Both designs are checked, not just the one that ships: the variant is
        # rendered from the same run, and a build that quietly stopped
        # producing it would leave compare.html pointing at a stale file.
        run: |
          for page in index contrast; do
            for needle in zone-ticker card bg-contours; do
              grep -q "$needle" "docs/$page.html" || { echo "missing in $page: $needle" >&2; exit 1; }
            done
            bytes=$(wc -c < "docs/$page.html")
            echo "$page.html: ${bytes} bytes"
            [ "$bytes" -gt 20000 ] || { echo "$page.html suspiciously small" >&2; exit 1; }
          done
          grep -q 'data-theme="classic"'  docs/index.html    || { echo "index.html is not the classic design" >&2; exit 1; }
          grep -q 'data-theme="contrast"' docs/contrast.html || { echo "contrast.html is not the variant" >&2; exit 1; }
          [ -s docs/compare.html ] || { echo "compare.html missing" >&2; exit 1; }

          # The ONE card, by name. A widget whose feed does not answer renders
          # NOTHING at all (brief §18 — on a lobby wall a missing card beats an
          # error message), which is right on the screen and wrong in a build:
          # the page still passes every check above and quietly publishes over
          # a deploy that had the card. That happened on 13.10.2026 — ONE
          # stopped answering this runner while Ynet, fetched from the same
          # job seconds apart, kept returning headlines — and the card was gone
          # from the live screen for half an hour before anyone looked.
          #
          # Failing here keeps the previous deploy serving until a build gets
          # the feed again. The cost is that NOTHING else refreshes while ONE
          # is down, the ticker included; that is Aviv's call, made knowing it.
          #
          # If the ONE card is ever dropped on purpose, the way the Ynet card
          # was, this check comes out with it.
          #
          # v9.5 moved the needle. The card now always emits a shell for the
          # browser to fill, so `is-sport` is in the page whether or not the
          # build got the feed — grepping for it would have looked like a
          # guard and checked nothing. data-served carries the count the
          # SERVER rendered, which is the only thing this step can know about.
          for page in index contrast; do
            grep -q 'data-served="0"' "docs/$page.html" && {
              echo "the ONE card came back empty in $page.html — its feed did not answer." >&2
              echo "keeping the previous deploy rather than publishing a screen without it." >&2
              exit 1; }
            grep -q 'data-served=' "docs/$page.html" || {
              echo "$page.html has no ONE card at all — the widget did not render." >&2
              exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
